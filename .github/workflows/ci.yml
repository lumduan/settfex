name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/**"
      - ".github/workflows/ci.yml"

jobs:
  lint:
    name: Lint & Type
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv stopped publishing floating major tags at v8 — pin the exact version.
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          # Pinned for reproducible builds — "latest" silently adopts whatever uv shipped
          # that day. Dependabot does not bump action *inputs*, so bump this by hand.
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install 3.11

      # --frozen only means "install exactly what the lock says" — it does NOT verify the
      # lock is still consistent with pyproject.toml (that is --locked / `uv lock --check`).
      # Without this gate, a pyproject edit without `uv lock` runs CI against a stale lock.
      - run: uv lock --check
      - run: uv sync --group dev --frozen

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy settfex/

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # Without this, `uv sync` and `uv run` follow `.python-version` (3.13), not the
      # `uv python install` below, so every leg of this matrix ran CPython 3.13 until
      # 2026-11-24. The assert step makes a regression of that visible.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      # setup-uv stopped publishing floating major tags at v8 — pin the exact version.
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          # Pinned for reproducible builds — "latest" silently adopts whatever uv shipped
          # that day. Dependabot does not bump action *inputs*, so bump this by hand.
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --group dev --frozen
      - name: Assert the interpreter is the matrix version
        run: >-
          uv run python -c "import sys; want = '${{ matrix.python-version }}';
          got = '%d.%d' % sys.version_info[:2]; print('python', sys.version.split()[0]);
          assert got == want, f'matrix asks for {want}, running {got}'"

      - run: uv run pytest --cov=settfex --cov-branch --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false
