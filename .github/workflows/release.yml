# Triggered by version tags: v0.2.0, v1.0.0, v1.0.0-beta.1, etc.
# Pipeline: validate tag → CI → build → publish PyPI → create GitHub Release
#
# One-time setup required:
#   1. PyPI Trusted Publisher configured for this workflow + environment "pypi"
#   2. GitHub environment "pypi" created in repo Settings → Environments

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write   # create GitHub Release + upload assets
  id-token: write   # OIDC token for PyPI Trusted Publisher

jobs:
  # ── 1. Validate tag matches pyproject.toml version ──────────────────────────
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}

    steps:
      - uses: actions/checkout@v7

      - name: Parse tag and detect pre-release
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "$TAG" =~ -(alpha|beta|rc) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches pyproject.toml
        run: |
          PYPROJECT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG_VERSION="${{ steps.parse.outputs.version }}"
          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch: pyproject.toml=${PYPROJECT_VERSION}, tag=${TAG_VERSION}"
            echo "   Bump the version in pyproject.toml before tagging."
            exit 1
          fi
          echo "✅ Version ${TAG_VERSION} matches pyproject.toml"

      # The version lives in TWO hand-synced places (RELEASING.md): pyproject.toml and
      # settfex/__init__.py. Grep (not import — the release runner has no deps installed)
      # so a forgotten __init__ bump fails at validate instead of shipping a wheel whose
      # settfex.__version__ lies. tests/test_public_api_surface.py::test_version_sync
      # guards the same invariant in CI.
      - name: Verify tag matches settfex/__init__.py
        run: |
          INIT_VERSION=$(grep -Po '(?<=^__version__ = ")[^"]+' settfex/__init__.py)
          TAG_VERSION="${{ steps.parse.outputs.version }}"
          if [ "$INIT_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch: settfex/__init__.py=${INIT_VERSION}, tag=${TAG_VERSION}"
            echo "   Bump __version__ in settfex/__init__.py before tagging."
            exit 1
          fi
          echo "✅ Version ${TAG_VERSION} matches settfex/__init__.py"

  # ── 2. Full CI gate ─────────────────────────────────────────────────────────
  ci:
    name: CI
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # setup-uv stopped publishing floating major tags at v8 — pin the exact version.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # Pinned for reproducible builds — "latest" silently adopts whatever uv shipped
          # that day. Dependabot does not bump action *inputs*, so bump this by hand.
          # This is the release path: the uv that builds the published artifact.
          version: "0.11.33"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install 3.11
      - run: uv sync --group dev --frozen

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy settfex/
      - run: uv run pytest --cov=settfex --cov-branch -v

  # ── 3. Build sdist + wheel ───────────────────────────────────────────────────
  build:
    name: Build
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # setup-uv stopped publishing floating major tags at v8 — pin the exact version.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # Pinned for reproducible builds — "latest" silently adopts whatever uv shipped
          # that day. Dependabot does not bump action *inputs*, so bump this by hand.
          # This is the release path: the uv that builds the published artifact.
          version: "0.11.33"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install 3.11
      - run: uv run python -m build

      - name: Verify dist contents
        run: ls -lh dist/

      # py.typed ships only implicitly (hatchling includes everything under packages=["settfex"]);
      # nothing else asserts it, and losing it would silently strip type information from every
      # downstream mypy run. Fail the release before publish if the wheel does not carry it.
      - name: Assert py.typed ships in the wheel
        run: unzip -l dist/*.whl | grep -q "settfex/py.typed" && echo "✅ py.typed present"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ── 4. Publish to PyPI (Trusted Publisher — no token needed) ─────────────────
  publish-pypi:
    name: Publish → PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/settfex/${{ needs.validate.outputs.version }}/

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
        # Uses OIDC Trusted Publisher — no PYPI_TOKEN secret required.
        # skip-existing: true allows re-running the workflow if the file was already
        # published manually without failing the job.

  # ── 5. Create GitHub Release with changelog body ─────────────────────────────
  github-release:
    name: GitHub Release
    needs: [validate, publish-pypi]
    runs-on: ubuntu-latest
    if: always() && needs.validate.result == 'success' && needs.publish-pypi.result != 'failure'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract changelog section
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          python3 - "$VERSION" <<'PYEOF'
          import re, sys
          version = sys.argv[1]
          content = open("CHANGELOG.md").read()
          pattern = rf"(?m)^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          match = re.search(pattern, content, re.DOTALL)
          notes = match.group(1).strip() if match else f"Release v{version}"
          with open("release_notes.txt", "w") as f:
              f.write(notes + "\n")
          PYEOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "settfex v${{ needs.validate.outputs.version }}"
          body_path: release_notes.txt
          prerelease: ${{ needs.validate.outputs.is_prerelease }}
          files: dist/*
          make_latest: ${{ needs.validate.outputs.is_prerelease == 'false' }}
