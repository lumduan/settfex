# Monthly dependency-drift report — the mechanism that stops the lock aging silently.
#
# Dependabot proposes individual bumps weekly, but it cannot see the whole picture (and ruff
# is permanently server-side-ignored there — see .github/dependabot.yml). This workflow posts
# ONE standing issue with the full outdated table each month, so drift is a visible, dated
# artifact instead of something rediscovered by hand every quarter. Bumps themselves follow
# the Dependency policy in CLAUDE.md (per-package commits, curl_cffi live-probe protocol).
#
# It also watches the two pins NOTHING else here can see, because neither is a lock entry:
# the uv BINARY (the `version:` input on setup-uv) and the ruff 2-place lockstep (uv.lock vs
# the .pre-commit-config.yaml rev). `uv tree --outdated` is blind to both.

name: Dependency drift

on:
  schedule:
    - cron: "17 2 1 * *" # monthly, 1st at 02:17 UTC (09:17 Asia/Bangkok)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    name: Outdated report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv stopped publishing floating major tags at v8 — pin the exact version.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          # Pinned for reproducible builds — "latest" silently adopts whatever uv shipped
          # that day. Dependabot does not bump action *inputs*, so bump this by hand.
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Each check writes its finished bullet to report-head.md rather than handing markdown
      # back through `${{ }}` into a later `echo "..."`. These strings contain backticks, and
      # an interpolated backtick is COMMAND SUBSTITUTION: the STALE branch below used to
      # render as bash running `uv lock` inside the report step. Never round-trip markdown
      # through a shell string.
      - name: Check lock consistency
        run: |
          if uv lock --check; then
            printf -- '- **uv.lock:** consistent with pyproject.toml\n' > report-head.md
          else
            printf -- '- **uv.lock:** **STALE** — no longer matches pyproject.toml (run `uv lock`)\n' > report-head.md
          fi

      # Two hand-maintained pins are invisible to everything else here:
      #   * the uv BINARY (`version:` input) — Dependabot's github-actions ecosystem bumps the
      #     action ref (astral-sh/setup-uv@vX) but never an action *input*, and uv is not a
      #     lock entry, so `uv tree --outdated` cannot see it either;
      #   * the ruff 2-place change — uv.lock and the .pre-commit-config.yaml rev must move
      #     together, and nothing fails if only one of them does.
      # This step is the only thing that watches either. It reports; it never fails the job.
      - name: Check the hand-maintained pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Anchor on the `- uses:` line. This workflow TALKS about setup-uv in its own comments
          # and greps, and an unanchored pattern counts those too — it read 10 steps instead of
          # 7 the first time it was written.
          USES='^[[:space:]]*-[[:space:]]uses:[[:space:]]astral-sh/setup-uv@'

          # Read the pin from the binary this job actually ran with, never as a restated
          # literal — a literal here would be one more surface that can go stale.
          PIN="$(uv --version | awk '{print $2}')"
          STEPS="$(grep -hE "$USES" .github/workflows/*.yml | wc -l)"
          PINS="$(grep -hA6 -E "$USES" .github/workflows/*.yml \
                  | sed -n 's/^[[:space:]]*version: "\([^"]*\)"/\1/p' | sort -u)"
          NPINS="$(printf '%s\n' "$PINS" | grep -c . || true)"
          LATEST="$(gh api repos/astral-sh/uv/releases/latest --jq .tag_name 2>/dev/null || true)"

          if [ -z "$PIN" ]; then
            UV="could not read the uv version from the binary on PATH"
          elif [ "$NPINS" -gt 1 ]; then
            # A pin bumped in one workflow but not another is its own bug.
            UV="**PINS DISAGREE** across the $STEPS \`setup-uv\` steps: $(printf '%s' "$PINS" | tr '\n' ' ') — fix by hand"
          elif [ -z "$LATEST" ]; then
            UV="\`$PIN\` in all $STEPS \`setup-uv\` steps — could not reach the uv release API to compare"
          elif [ "$PIN" = "$LATEST" ]; then
            UV="\`$PIN\` in all $STEPS \`setup-uv\` steps — current"
          else
            UV="\`$PIN\` in all $STEPS \`setup-uv\` steps — **STALE** (latest: \`$LATEST\`); bump the \`version:\` input by hand"
          fi

          LOCK="$(awk '/^name = "ruff"$/{getline; if ($1=="version") {gsub(/"/,"",$3); print $3; exit}}' uv.lock)"
          HOOK="$(awk '/ruff-pre-commit/{getline; if ($1=="rev:") {sub(/^v/,"",$2); print $2; exit}}' .pre-commit-config.yaml)"
          if [ -z "$LOCK" ] || [ -z "$HOOK" ]; then
            RUFF="could not read one of the two pins (lock=\`${LOCK:-?}\`, pre-commit=\`${HOOK:-?}\`)"
          elif [ "$LOCK" = "$HOOK" ]; then
            RUFF="uv.lock \`$LOCK\` == .pre-commit-config.yaml \`v$HOOK\` — in step"
          else
            RUFF="**OUT OF STEP** — uv.lock \`$LOCK\` vs .pre-commit-config.yaml \`v$HOOK\`; the ruff bump is a 2-place change"
          fi

          {
            printf -- '- **uv pin (hand-maintained):** %s\n' "$UV"
            printf -- '- **ruff lockstep:** %s\n' "$RUFF"
            printf -- '- Generated by `.github/workflows/dependency-drift.yml` (uv %s).\n' "$PIN"
          } >> report-head.md

      - name: Build outdated table
        run: |
          {
            echo "## Dependency drift report — $(date -u +%F)"
            echo
            cat report-head.md
            echo
            echo '```'
            uv tree --outdated --depth 1 --all-groups
            echo '```'
            echo
            echo "Entries annotated \`(latest: X)\` are outdated; no annotation = current."
            echo
            echo "### Standing notes (not bugs — context for the reader)"
            echo "- **ruff** bumps are manual by design: Dependabot server-side-ignores it (PR #88);"
            echo "  bump uv.lock and the .pre-commit-config.yaml rev in lockstep, and keep"
            echo '  `extend-exclude = ["*.md"]` (see the CLAUDE.md gotcha).'
            echo "- **The two pins above need a bespoke check** because neither is a lock entry:"
            echo "  Dependabot's github-actions ecosystem bumps the setup-uv action *ref*, never"
            echo "  its \`version:\` *input*, and a pre-commit rev is not a dependency at all."
            echo "  A uv bump is its own change with its own gates — Dependency policy, CLAUDE.md."
            echo "- **hatchling** (build backend) is unconstrained in [build-system] and absent from"
            echo "  uv.lock — releases resolve whatever is current at build time."
            echo "- **diskcache** upstream is dormant (last release 2023, last commit 2024) and is"
            echo "  at its last release — so its advisory **PYSEC-2026-2447 / CVE-2025-69872**"
            echo "  (pickle deserialization; empty Fix Versions because no fixed release exists)"
            echo "  cannot be cleared by a bump. It is the only flagged **runtime** dependency —"
            echo "  everything else pip-audit reports is dev/extras. Exploiting it needs write"
            echo "  access to the cache dir (\`~/.settfex/cache\` by default). This is a decision"
            echo "  to make once, not a finding to re-triage monthly."
            echo "- Bumps follow the **Dependency policy** in CLAUDE.md: one package per commit, full"
            echo "  gates each, and curl_cffi additionally requires the live-probe protocol"
            echo '  (`uv run pytest -m integration --no-cov` before/after with cache clear).'
          } > body.md
          cat body.md

      - name: Create or update the standing issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create dependency-drift --force \
            --description "Monthly outdated-dependency report" --color "0e8a16"
          NUMBER=$(gh issue list --label dependency-drift --state open \
            --json number --jq '.[0].number' || true)
          if [ -z "$NUMBER" ]; then
            gh issue create \
              --title "Monthly dependency drift report" \
              --label dependency-drift \
              --body-file body.md
          else
            gh issue edit "$NUMBER" --body-file body.md
            gh issue comment "$NUMBER" --body "Refreshed $(date -u +%F) by the dependency-drift workflow."
          fi
