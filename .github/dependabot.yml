version: 2
updates:
  # Python dependencies (uv.lock / pyproject.toml).
  # If your Dependabot version rejects the "uv" ecosystem, change it to "pip".
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    # NOTE: `ruff` is on Dependabot's PERMANENT IGNORE LIST and will never appear here again.
    # Set on 2026-08-25 via `@dependabot ignore this dependency` on PR #88, after the same bump
    # was rejected three times (#61 -> #78 -> #88): ruff 0.16+ formats Python code blocks inside
    # Markdown, so `ruff format --check` wants to reformat 34 of our .md files. See the "Ruff is
    # FROZEN at 0.13.2" gotcha in CLAUDE.md.
    # The ignore is stored in Dependabot's own state, NOT in this file -- do not add an `ignore:`
    # block here expecting to control it. To re-enable ruff updates, RE-OPEN PR #88 (or comment
    # `@dependabot unignore ruff` on any other Dependabot PR).

  # GitHub Actions used in workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
